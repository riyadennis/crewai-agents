[tool.poetry]
name = "docker-inspector-crew"
version = "0.1.0"
description = "CrewAI crew that audits Docker containers and reports duplicates"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<=3.13"
crewai = {extras = ["tools"], version = "^0.28.8"}
langchain-anthropic = ">=0.1.0,<0.2.0"
setuptools = "^69.0.0"

[tool.poetry.scripts]
docker_inspector_crew = "docker_inspector_crew.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
